name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar MinHook
        shell: bash
        run: |
          rm -rf third_party/minhook
          git clone --depth 1 --branch v1.3.3 https://github.com/TsudaKageyu/minhook.git third_party/minhook

      - name: Configurar (32 bits)
        run: cmake -S . -B build -A Win32

      - name: Compilar
        run: cmake --build build --config Release

      - name: Mostrar salida
        shell: bash
        run: ls -la build/Release

      - uses: actions/upload-artifact@v4
        with:
          name: gtskate_net
          path: build/Release/gtskate_net.asi
